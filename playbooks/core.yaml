---
- name: Core edge nodes (DNS + VIP)
  hosts: core
  become: true
  vars_files:
    - "../vars/vault.yaml"

  pre_tasks:
    - name: Set timezone
      community.general.timezone:
        name: "{{ ntp_timezone }}"

  roles:
    - role: ironicbadger.packages
      tags: packages

    - role: core-network
      tags: network

    - role: core-chrony
      tags: chrony

    - role: core-adguardhome
      tags: adguard

    - role: core-caddy
      tags: caddy

    - role: core-keepalived
      tags: keepalived

    - role: core-adguardhome-sync
      tags: sync
