---
- name: Core edge nodes (DNS + VIP)
  hosts: core
  become: true
  # Deviation from upstream: one node at a time, BACKUP (core-pi4-2) first,
  # so the two DNS nodes are never restarted together and a bad change shows
  # up on the backup before it reaches the VIP holder. If the first node
  # fails, the play stops before touching the second.
  serial: 1
  order: reverse_inventory
  vars_files:
    - "../vars/vault.yaml"

  pre_tasks:
    # dhcp_reservations (group_vars/dns.yaml) feeds the AdGuard rewrites and is
    # the list OPNsense's DHCP hosts are copied from, so a reused MAC, IP or
    # name must stop the run before anything changes. Names include the
    # custom_dns aliases, since they share the local domain with hostnames.
    - name: Check dhcp_reservations for duplicate MACs, IPs and names
      ansible.builtin.assert:
        that:
          - _dupe_macs | length == 0
          - _dupe_ips | length == 0
          - _dupe_names | length == 0
        fail_msg: >-
          Duplicates in group_vars/dns.yaml -
          MACs: {{ _dupe_macs }}, IPs: {{ _dupe_ips }}, names: {{ _dupe_names }}
        quiet: true
      vars:
        _macs: "{{ dhcp_reservations | map(attribute='mac') | map('lower') | list }}"
        _ips: "{{ dhcp_reservations | map(attribute='ip') | list }}"
        _names: >-
          {{ (dhcp_reservations | map(attribute='hostname') | list
              + dhcp_reservations | map(attribute='custom_dns', default=[]) | flatten)
             | map('lower') | list }}
        _dupe_macs: "{{ _macs | community.general.counter | dict2items | selectattr('value', 'gt', 1) | map(attribute='key') | list }}"
        _dupe_ips: "{{ _ips | community.general.counter | dict2items | selectattr('value', 'gt', 1) | map(attribute='key') | list }}"
        _dupe_names: "{{ _names | community.general.counter | dict2items | selectattr('value', 'gt', 1) | map(attribute='key') | list }}"
      run_once: true
      tags: always

    - name: Set timezone
      community.general.timezone:
        name: "{{ ntp_timezone }}"

    # artis3n.tailscale.machine writes tailscale.sources with its own keyring;
    # a leftover tailscale.list from the old standalone role makes apt fail
    # with "Conflicting values set for option Signed-By".
    - name: Remove legacy Tailscale apt source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/tailscale.list
        state: absent
      become: true
      tags: tailscale

  roles:
    - role: ironicbadger.packages
      tags: packages

    - role: core-network
      tags: network

    - role: core-chrony
      tags: chrony

    - role: core-adguardhome
      tags: adguard

    - role: core-caddy
      tags: caddy

    - role: core-keepalived
      tags: keepalived

    # Passed as a role param so it wins over any tailscale_authkey in the vault
    # (vars_files beat group_vars). Settings are in group_vars/core.yaml.
    - role: artis3n.tailscale.machine
      tags: tailscale
      vars:
        tailscale_authkey: "{{ tailscale_core_oauth_secret }}"

    # Must stay before core-adguardhome-sync: that role ends the play early
    # (meta: end_host) on nodes that are not the sync origin.
    - role: core-adguardhome-config
      tags: adguard-config

    - role: core-adguardhome-sync
      tags: sync
