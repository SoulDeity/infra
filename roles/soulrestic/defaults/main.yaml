restic_backup_locations: []
restic_backup_excludes: []
restic_dir: "{{ hostname }}"

# Backup schedule. Override per host group so the three hosts do not all hit
# B2 at once -- and, on soulpms, so restic is not competing with sanoid's
# snapshot and prune run at 02:00.
restic_cron_hour: 2
restic_cron_minute: 15

# Integrity check schedule. Only installed when restic_check_healthchecks_id
# is defined. Keep it well clear of the backup window.
restic_check_cron_weekday: 0
restic_check_cron_hour: 4
restic_check_cron_minute: 0
restic_check_subset: "10%"

# Retention. --keep-last 3 is added unconditionally in the script as a floor.
restic_keep_daily: 30
restic_keep_monthly: 12

restic_retry_lock: "10m"
restic_log_keep_days: 14
