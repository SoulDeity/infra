- name: Install restic
  package:
    name: restic
  become: true

- name: Make user
  user:
    name: restic
    shell: /bin/nologin
    system: false
  become: true

- name: Create log directory
  file:
    path: /home/restic/log
    state: directory
    mode: "0750"
    owner: restic
    group: restic
  become: true

- name: Install backrest
  template:
    src: files/backrest.sh
    dest: /home/restic/backrest.sh
    mode: "0700"
    owner: restic
  become: true
  no_log: true

- name: Install includes files
  copy:
    content: "{{ restic_backup_locations | join('\n') }}"
    dest: /home/restic/restic-include.txt
    mode: "0644"
    owner: restic
  become: true

- name: Install excludes files
  copy:
    content: "{{ restic_backup_excludes | join('\n') }}"
    dest: /home/restic/restic-excludes.txt
    mode: "0644"
    owner: restic
  become: true

- name: Set restic binary permissions
  file:
    path: /usr/bin/restic
    mode: "0750"
    owner: root
    group: restic
  become: true

- name: Set cap_dac_read_search=+ep on restic
  community.general.capabilities:
    path: /usr/bin/restic
    capability: cap_dac_read_search=+ep
  become: true

- name: Schedule backup
  cron:
    name: restic backup
    hour: "{{ restic_cron_hour }}"
    minute: "{{ restic_cron_minute }}"
    job: /home/restic/backrest.sh cron_backup
    user: restic
  become: true

- name: Schedule integrity check
  cron:
    name: restic check
    weekday: "{{ restic_check_cron_weekday }}"
    hour: "{{ restic_check_cron_hour }}"
    minute: "{{ restic_check_cron_minute }}"
    job: /home/restic/backrest.sh cron_check
    user: restic
  become: true
  when: restic_check_healthchecks_id is defined

# Superseded by prune_logs() in backrest.sh. Log filenames are unique per run,
# so logrotate rotated each file exactly once to .log.1.gz -- which no longer
# matched the *.log glob -- and `rotate 14` never deleted anything.
- name: Remove obsolete logrotate config
  file:
    path: /etc/logrotate.d/backrest
    state: absent
  become: true
