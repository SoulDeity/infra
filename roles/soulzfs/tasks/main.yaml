- name: Set module options
  template:
    src: files/zfs-modprobe.conf
    dest: /etc/modprobe.d/zfs.conf
    mode: "0644"
  become: true

- name: Locate zpool command
  command:
    cmd: which zpool
    strip_empty_ends: true
  register: which_zpool
  changed_when: false
  become: true

# Only `zfs create` (new tank/appdata/<app> datasets) skips the password.
# zfs list / zpool status work without sudo; anything else asks for it.
- name: Allow passwordless zfs create
  copy:
    dest: /etc/sudoers.d/zfs-create
    content: "{{ main_username }} ALL=(root) NOPASSWD: /usr/sbin/zfs create *\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  become: true

- name: Remove old blanket ZFS rule from /etc/sudoers
  lineinfile:
    path: /etc/sudoers
    line: "{{ main_username }} ALL=(ALL) NOPASSWD: /usr/sbin/zfs,/usr/sbin/zpool"
    state: absent
    validate: visudo -cf %s
  become: true

- name: Sanoid
  include_tasks: sanoid.yaml

- name: Healthchecks
  include_tasks: healthchecks.yaml
