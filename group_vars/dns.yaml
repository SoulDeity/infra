# Hosts that serve local DNS: the Pi-hole LXC (being retired) and the core
# edge nodes. Everything here is the single source of truth for fixed IPs.
#
# - DHCP: reservations are served by OPNsense (Services > Dnsmasq DNS & DHCP >
#   Hosts). Keep that table in sync with this list (it has CSV import/export).
# - DNS: the core nodes generate an exact AdGuard rewrite
#   <hostname>.<local domain> -> ip for every entry, plus <custom_dns>.<local
#   domain> for each custom_dns name (see core-adguardhome-config).

