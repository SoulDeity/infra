services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:latest
    build: .
    container_name: bambuddy
    cap_add:
      - NET_BIND_SERVICE
    network_mode: host
    labels:
      - "traefik.http.routers.bambuddy.rule=Host(`bambuddy.a.{{ local_domain }}`)"
      - traefik.http.services.bambuddy.loadbalancer.server.port=8000
    volumes:
      - "{{ appdata_path }}/bambuddy/data:/app/data"
      - "{{ appdata_path }}/bambuddy/logs:/app/logs"
    environment:
      - TZ=${TZ:-America/Chicago}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PORT=${PORT:-8000}
    restart: unless-stopped
  orca-slicer-api:
    image: ghcr.io/maziggy/orca-slicer-api:latest
    container_name: orca-slicer-api
    labels:
      - traefik.enable=false
    restart: unless-stopped
    ports:
      - "3003:3000"
    volumes:
      - "{{ appdata_path }}/orca:/app/data"
    environment:
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  bambu-studio-api:
    image: ghcr.io/maziggy/bambu-studio-api:latest
    container_name: bambu-studio-api
    labels:
      - traefik.enable=false
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - "{{ appdata_path }}/bambu:/app/data"
    environment:
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  # Obico Spaghetti Detection
  ml_api:
    hostname: ml_api
    container_name: ml_api
    labels:
      - traefik.enable=false
    restart: unless-stopped
    build:
      context: https://github.com/TheSpaghettiDetective/obico-server.git#:ml_api
    environment:
      DEBUG: "True"
      FLASK_APP: "server.py"
      # ML_API_TOKEN:
    tty: true
    command: bash -c "gunicorn --bind 0.0.0.0:3333 --workers 1 wsgi"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --no-check-certificate http://ml_api:3333/hc/"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
