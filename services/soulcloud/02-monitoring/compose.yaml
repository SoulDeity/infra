services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "uptime"
      tsdproxy.port.1: "443/https:3001/http"
    volumes:
      - "{{ appdata_path }}/uptime-kuma:/app/data"
    restart: unless-stopped
  healthchecks:
    image: lscr.io/linuxserver/healthchecks
    container_name: healthchecks
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "hc"
      tsdproxy.port.1: "443/https:8000/http"
    volumes:
      - "{{ appdata_path }}/healthchecks:/config"
    environment:
      - "PUID={{ docker_compose_generator_uid }}"
      - "PGID={{ docker_compose_generator_gid }}"
      - "TZ={{ host_timezone }}"
      - APPRISE_ENABLED=True
      - DEBUG=False
      - PING_BODY_LIMIT=100000
      - SITE_NAME=Health Checks
      - "SITE_ROOT=https://hc.{{ secret_domain_cloud }}"
      - "ALLOWED_HOSTS=hc.{{ secret_domain_cloud }}"
      - "SUPERUSER_EMAIL={{ secret_hc_email }}"
      - "SUPERUSER_PASSWORD={{ secret_hc_pass }}"
    restart: unless-stopped
  librespeed:
    image: lscr.io/linuxserver/librespeed
    container_name: librespeed
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "speed"
      tsdproxy.port.1: "443/https:80/http"
    volumes:
      - "{{ appdata_path }}/librespeed:/config"
    environment:
      - "PUID={{ docker_compose_generator_uid }}"
      - "PGID={{ docker_compose_generator_gid }}"
      - "TZ={{ host_timezone }}"
      - MODE=standalone
      - TELEMETRY=false
    restart: unless-stopped
