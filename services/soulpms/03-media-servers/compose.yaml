services:
  plex:
    image: lscr.io/linuxserver/plex
    container_name: plex
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - "{{ appdata_path }}/plex:/config"
      - /dev/shm:/config/transcodes
      - "{{ data_path }}:/data:ro"
    environment:
      - "PUID={{ docker_compose_generator_uid }}"
      - "PGID={{ docker_compose_generator_gid }}"
      - "TZ={{ host_timezone }}"
      - VERSION=latest
    labels:
      - "traefik.http.routers.plex.rule=Host(`plex.{{ secret_domain_full }}`)"
      - "traefik.http.routers.plex.tls=true"
      - traefik.http.services.plex.loadbalancer.server.port=32400
    restart: unless-stopped
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf
    container_name: audiobookshelf
    user: "{{ docker_compose_generator_uid }}:{{ docker_compose_generator_gid }}"
    labels:
      - "traefik.http.routers.audiobookshelf.rule=Host(`abs.{{ secret_domain_full }}`)"
    volumes:
      - "{{ appdata_path }}/audiobookshelf/metadata:/metadata"
      - "{{ appdata_path }}/audiobookshelf/config:/config"
      - "{{ data_path }}:/data"
    restart: unless-stopped
  grimmory:
    image: ghcr.io/grimmory-tools/grimmory:latest
    container_name: grimmory
    labels:
      - "traefik.http.routers.grimmory.rule=Host(`books.{{ secret_domain_full }}`)"
      - traefik.http.services.grimmory.loadbalancer.server.port=6060
    environment:
      - "APP_USER_ID={{ docker_compose_generator_uid }}"
      - "APP_GROUP_ID={{ docker_compose_generator_gid }}"
      - "TZ={{ host_timezone }}"
      - DATABASE_URL=jdbc:mariadb://grimmory-db:3306/booklore
      - DATABASE_USERNAME=booklore
      - "DATABASE_PASSWORD={{ secret_bookloredb_pass }}"
      - BOOKLORE_PORT=6060
    depends_on:
      grimmory-db:
        condition: service_healthy
    volumes:
      - "{{ appdata_path }}/booklore/data:/app/data"
      - "{{ appdata_path }}/booklore/bookdrop:/bookdrop"
      - "{{ appdata_path }}/booklore/books:/books"
      - "{{ data_path }}:/data"
    restart: unless-stopped
    healthcheck:
      test: wget -q -O - http://localhost:6060/api/v1/healthcheck
      interval: 60s
      retries: 5
      start_period: 60s
      timeout: 10s
  grimmory-db:
    image: lscr.io/linuxserver/mariadb:11.4.5
    container_name: grimmory-db
    labels:
      - traefik.enable=false
    environment:
      - "PUID={{ docker_compose_generator_uid }}"
      - "PGID={{ docker_compose_generator_gid }}"
      - "TZ={{ host_timezone }}"
      - "MYSQL_ROOT_PASSWORD={{ secret_bookloredb_pass }}"
      - MYSQL_DATABASE=booklore
      - MYSQL_USER=booklore
      - "MYSQL_PASSWORD={{ secret_bookloredb_pass }}"
    volumes:
      - "{{ appdata_path }}/booklore-db/mariadb/config:/config"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
